name: Pages

# Publishes the documentation site to GitHub Pages.
#
# The site holds the latest docs at the root and a frozen copy of every
# release under its own version number:
#
#   /rules/no-restricted-tags.html         what master says today
#   /0.0.5/rules/no-restricted-tags.html   what 0.0.5 shipped
#
# A Pages deployment replaces the whole site rather than adding to it, so
# there is no such thing as deploying one version on its own: every run
# assembles all of them. Both triggers therefore do the same work, and either
# one on its own leaves the site complete.
#
# Nothing is committed: the whole site is generated during the run and
# uploaded as a Pages artifact.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# The default for both jobs. The Pages and OIDC scopes are granted to the
# deploy job alone, so the job that runs the project's own build never holds
# a credential that can publish.
permissions:
  contents: read

# One deployment at a time, and never cancel one that is already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit hash; the tag in the comment is what
      # dependabot reads when it moves the hash forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Each release is rebuilt from its own tag, so the whole history and
          # every tag has to be here rather than just the tip.
          fetch-depth: 0
          # Nothing here pushes, so the token has no business staying in
          # .git/config where later steps could read it.
          persist-credentials: false

      # No npm cache: this artifact is deployed, and a cache entry poisoned by
      # a run on any branch would be baked into the published site.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - run: npm ci

      # Builds the latest docs from master, then one copy per release tag,
      # each from its own tag so that it documents the rules that release
      # actually shipped.
      - name: Assemble every version of the site
        run: ./scripts/build-site.sh _site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Least privilege for publishing to Pages over OIDC, scoped to the only
    # job that needs it.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
