name: Release

# Fires when a version tag is pushed. Bump and tag locally:
#
#   npm version patch      # bumps package.json, commits, tags v0.0.4
#   git push --follow-tags
#
# This builds the tag, checks it, and creates the GitHub release with the npm
# tarball attached. Publishing that release to npm is a separate, manual step:
# see publish.yml.
on:
  push:
    tags:
      - 'v*'

# Needed to create the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit hash; the tag in the comment is what
      # dependabot reads when it moves the hash forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release is created through `gh`, which takes its token from the
          # environment, so the git credential does not need to persist.
          persist-credentials: false

      # No npm cache: this run produces the tarball people install, and a cache
      # entry poisoned by a run on any branch would end up inside it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Read the version from package.json
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # `npm version` keeps these in step; a hand-made tag might not.
      - name: Check the tag matches package.json
        env:
          PKG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'."
            exit 1
          fi

      - run: npm ci

      # A release is a gate: nothing broken gets a tag people can install.
      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The npm-native tarball, so the release can be installed straight from
      # GitHub and so there is a record of exactly what was published.
      - name: Pack the npm tarball
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          ls -la release-artifacts

      # `gh` ships with the runner, so this needs no third-party action.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            release-artifacts/*.tgz
