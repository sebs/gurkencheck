name: Publish

# Publishes an already-released version to npm and to the VS Code Marketplace.
# Run it by hand, after the release.yml run for that tag has gone green.
#
# Nothing is built here. The release holds the two files - the npm tarball and
# the .vsix - that release.yml built and tested from the tag, and those exact
# files are what go out. Both are checked to be on the release before either
# is published, then they go out side by side.
#
# Neither side has a long-lived token in the repository.
#
# npm: Trusted Publishing (OIDC). GitHub mints a short-lived token for this
# run and npm checks it against the trusted publisher configured for the
# package. One-time setup on npmjs.com: package `gurkencheck` -> Settings ->
# Trusted Publisher -> GitHub Actions, repository `sebs/gurkencheck`,
# workflow `publish.yml`.
#
# VS Code Marketplace: Microsoft Entra workload identity federation (OIDC).
# azure/login exchanges this run's GitHub token for an Entra one, and vsce
# publishes with it. One-time setup:
#   1. A GitHub environment `marketplace` (Settings -> Environments), with
#      deployment branches and tags limited to the tag rule `v*` and the
#      branch `master`. Only runs from those refs can enter it, so Publish
#      can be started from the release's tag or from master.
#   2. An app registration in Entra ID, with a federated credential for
#      GitHub Actions: organization `sebs`, repository `gurkencheck`, entity
#      type Environment, environment `marketplace`. The repository sends the
#      immutable subject, so the credential's subject must read
#      repo:sebs@55102/gurkencheck@1346275103:environment:marketplace
#      (`gh api repos/sebs/gurkencheck/actions/oidc/customization/sub`).
#   3. That app added as a member of the `maschinenlesbar` publisher, with
#      the Contributor role, by the ID the "Show the ID" step prints, at
#      https://marketplace.visualstudio.com/manage/publishers/maschinenlesbar
#   4. Secrets AZURE_CLIENT_ID and AZURE_TENANT_ID, from the app, in the
#      repository or in the `marketplace` environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish, e.g. 0.0.4'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Both files or neither: a version that reached one place and not the other
  # because its file was missing is what this check is for.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the release holds both files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          assets="$(gh release view "v${VERSION}" --repo "$REPO" --json assets --jq '.assets[].name')"
          missing=0
          for file in "gurkencheck-${VERSION}.tgz" "gurkencheck-${VERSION}.vsix"; do
            if ! grep -qxF "$file" <<< "$assets"; then
              echo "::error::The release v${VERSION} has no ${file}."
              missing=1
            fi
          done
          exit "$missing"

  npm:
    needs: check
    runs-on: ubuntu-latest
    # OIDC needs an id-token; provenance is attached from this workflow run.
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, so no lockfile to cache against.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of the
      # version bundled with node. Pinned rather than @latest so a run is
      # reproducible; bump it by hand when npm ships something this needs.
      - name: Update npm
        # A global install cannot come out of the lockfile, hence the ignore.
        run: npm install -g npm@12.0.2 # zizmor: ignore[adhoc-packages]

      # So a run can be repeated when only the Marketplace half failed.
      - name: Check whether npm already has this version
        id: npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if npm view "gurkencheck@${VERSION}" version > /dev/null 2>&1; then
            echo "::notice::gurkencheck ${VERSION} is already on npm, so it is not published again."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tarball from the release
        if: steps.npm.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v${VERSION}" --repo "$REPO" --pattern "gurkencheck-${VERSION}.tgz"

      # No NPM_TOKEN: OIDC supplies the credential and provenance is generated
      # from this run.
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: npm publish "./gurkencheck-${VERSION}.tgz" --provenance --access public

  vscode:
    needs: check
    runs-on: ubuntu-latest
    # The federated credential trusts this environment, not a branch, so the
    # job's token is accepted from whichever allowed ref it was started on.
    environment: marketplace
    # For azure/login to exchange this run's token for an Entra one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          package-manager-cache: false

      # Pinned rather than @latest so a run is reproducible. A global install
      # cannot come out of the lockfile, hence the ignore.
      - name: Install vsce
        run: npm install -g @vscode/vsce@4.1.1 # zizmor: ignore[adhoc-packages]

      - name: Download the extension from the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v${VERSION}" --repo "$REPO" --pattern "gurkencheck-${VERSION}.vsix"

      # The Marketplace needs no Azure subscription, only the identity.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The publisher's member list wants this ID, which is neither the app's
      # client ID nor its object ID, and only the identity itself can look up.
      - name: Show the ID the Marketplace knows this identity by
        run: |
          id="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "::notice::Marketplace member ID: ${id} - it needs the Contributor role on the maschinenlesbar publisher."

      # --skip-duplicate: a repeated run passes over a version already there.
      - name: Publish to the VS Code Marketplace
        env:
          VERSION: ${{ inputs.version }}
        run: vsce publish --packagePath "./gurkencheck-${VERSION}.vsix" --azure-credential --skip-duplicate
