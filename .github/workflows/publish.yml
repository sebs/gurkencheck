name: Publish

# Publishes an already-released version to npm. Run it by hand, after the
# release.yml run for that tag has gone green.
#
# Authentication is npm Trusted Publishing (OIDC): GitHub mints a short-lived
# token for this run and npm checks it against the trusted publisher configured
# for the package, so there is no long-lived NPM_TOKEN in the repository.
#
# One-time setup on npmjs.com: package `gurkencheck` -> Settings ->
# Trusted Publisher -> GitHub Actions, repository `sebs/gurkencheck`,
# workflow `publish.yml`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish, e.g. 0.0.4'
        required: true
        type: string

# OIDC needs an id-token; provenance is attached from this workflow run.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Publish exactly the tagged source, not whatever the branch has moved on
      # to. Actions are pinned to a commit hash; the tag in the comment is what
      # dependabot reads when it moves the hash forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          # npm authenticates over OIDC, so nothing here needs the git
          # credential to outlive the checkout.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of the
      # version bundled with node. Pinned rather than @latest so a run is
      # reproducible; bump it by hand when npm ships something this needs.
      - name: Update npm
        # A global install cannot come out of the lockfile, hence the ignore.
        run: npm install -g npm@12.0.2 # zizmor: ignore[adhoc-packages]

      - name: Check package.json matches the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error::package.json is '$pkg', not the requested '$VERSION'."
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No NPM_TOKEN: OIDC supplies the credential and provenance is generated
      # from this run.
      - name: Publish to npm
        run: npm publish --provenance --access public
