name: CI

# Every branch and every pull request. Tags are handled by release.yml, so
# they are left out here rather than building the same commit twice.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

# Reading the code is all this workflow does.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, the current LTS, and the current line.
        node: ['22.x', '24.x', '26.x']

    steps:
      # Actions are pinned to a commit hash; the tag in the comment is what
      # dependabot reads when it moves the hash forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the token has no business staying in
          # .git/config where later steps could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Tests run straight off the TypeScript sources, using node's own type
      # stripping, so there is no build step needed before testing.
      - name: Test
        run: npm test

      # Covers src, test, site and scripts.
      - name: Type-check
        run: npm run typecheck

      # Proves the published output compiles.
      - name: Build
        run: npm run build

      # Proves the documentation site still generates.
      - name: Build the site
        run: npm run docs

      # The full assembly needs every tag and an install per release, which is
      # too much for every branch. Checking it parses catches the typos.
      - name: Check the site assembly script parses
        run: bash -n scripts/build-site.sh
