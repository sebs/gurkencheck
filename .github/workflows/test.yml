name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, the current LTS, and the current line.
        node: ['22.x', '24.x', '26.x']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The tests run straight off the TypeScript sources, using node's own
      # type stripping. No build step is needed to test.
      - run: npm test

      # Type checking covers src, test, site and scripts.
      - run: npm run typecheck

      # Prove the published output actually compiles.
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci
      - run: npm run docs

      # The generated site is committed, so a stale docs/ should fail the build.
      - name: Check docs/ is up to date
        run: |
          if ! git diff --quiet -- docs; then
            echo "docs/ is out of date. Run 'npm run docs' and commit the result."
            git diff --stat -- docs
            exit 1
          fi
