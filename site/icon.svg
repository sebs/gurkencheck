<!--
  The tab icon. Browsers take the SVG; iOS wants a PNG, so both are shipped.
  Redraw it after editing:  rsvg-convert -w 180 -h 180 site/icon.svg -o site/apple-touch-icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="gurkencheck">
  <rect width="64" height="64" rx="14" fill="#2f6f4f"/>
  <path d="M16 33.5 L27 45 L48 20" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
